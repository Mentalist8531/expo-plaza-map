<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시민광장 현재 위치 안내</title>
</head>
<body style="margin: 0; background-color: #1a1a1a;">

<div style="position: relative; width: 100%; max-width: 800px; margin: 0 auto; overflow: hidden;">
    
    <!-- 방금 깃허브에 올리신 map.jpg 파일을 불러옵니다 -->
    <img src="map.jpg" style="width: 100%; display: block;" alt="시민광장 조감도">
    
    <!-- 날카롭고 직관적인 핀 형태의 마커 -->
<div id="my-location" style="
    position: absolute; 
    width: 10px; 
    height: 10px; 
    background-image: url('data:image/svg+xml;utf8,<svg viewBox=\'0 0 24 24\' xmlns=\'http://www.w3.org/2000/svg\'><path d=\'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z\' fill=\'%23ff3b30\' stroke=\'white\' stroke-width=\'1.5\'/></svg>'); 
    background-repeat: no-repeat;
    /* translate(-50%, -100%)를 통해 핀의 가장 아래쪽 뾰족한 끝이 정확한 좌표에 닿도록 정렬합니다 */
    transform: translate(-50%, -100%); 
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    display: none; 
    z-index: 10;">
</div>

<script>
(function() {
    // 주의: 현장에 가셔서 구글 지도로 4개 모서리의 실제 위도/경도를 측정해 이 숫자를 바꿔주셔야 정확히 맞습니다!
    const corners = {
        nw: { lat: 36.374157, lng: 127.381188 }, // 좌측 상단 (북서)
        ne: { lat: 36.373882, lng: 127.395188 }, // 우측 상단 (북동)
        se: { lat: 36.364682, lng: 127.393471 }, // 우측 하단 (남동)
        sw: { lat: 36.364157, lng: 127.382771 }  // 좌측 하단 (남서)
    };

    const marker = document.getElementById('my-location');

    function calculatePosition(currentLat, currentLng) {
        const minLng = Math.min(corners.nw.lng, corners.sw.lng);
        const maxLng = Math.max(corners.ne.lng, corners.se.lng);
        const minLat = Math.min(corners.se.lat, corners.sw.lat);
        const maxLat = Math.max(corners.nw.lat, corners.ne.lat);

        if(currentLng < minLng || currentLng > maxLng || currentLat < minLat || currentLat > maxLat) {
            return null; 
        }

        const xRatio = (currentLng - minLng) / (maxLng - minLng);
        const yRatio = (maxLat - currentLat) / (maxLat - minLat);

        const topX = (1 - xRatio) * 0 + xRatio * 100;
        const bottomX = (1 - xRatio) * 0 + xRatio * 100; 
        
        const finalX = (1 - yRatio) * topX + yRatio * bottomX;
        const finalY = yRatio * 100;

        return { x: finalX, y: finalY };
    }

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const mapPos = calculatePosition(lat, lng);
                
                if (mapPos) {
                    marker.style.left = mapPos.x + '%';
                    marker.style.top = mapPos.y + '%';
                    marker.style.display = 'block';
                } else {
                    marker.style.display = 'none';
                }
            },
            function(error) { console.log("위치 추적 실패: ", error); },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
    }
})();

// 화면을 클릭하면 해당 지점의 X, Y 퍼센트(%)를 콘솔창과 알림창으로 띄워주는 디버깅 툴
    document.querySelector('img').addEventListener('click', function(e) {
        const rect = e.target.getBoundingClientRect();
        const xPos = ((e.clientX - rect.left) / rect.width) * 100;
        const yPos = ((e.clientY - rect.top) / rect.height) * 100;
        alert(`클릭한 위치: X: ${xPos.toFixed(2)}%, Y: ${yPos.toFixed(2)}%`);
    });    
    
</script>

</body>
</html>
