<!-- kakao_map.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>카카오 위성지도 GPS</title>
    <!-- 카카오 지도 API 로드 (발급받은 JavaScript 키 입력) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_JS_APP_KEY"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var mapContainer = document.getElementById('map'),
            mapOption = { 
                center: new kakao.maps.LatLng(36.3765, 127.3860), // 초기 좌표
                level: 3 // 확대 레벨
            };

        var map = new kakao.maps.Map(mapContainer, mapOption);

        // 지도 타입을 '하이브리드(위성+도로)'로 설정
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);

        // HTML5의 geolocation으로 사용할 수 있는지 확인합니다 
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                var lat = position.coords.latitude,
                    lon = position.coords.longitude;
                
                var locPosition = new kakao.maps.LatLng(lat, lon);
                
                // 마커와 인포윈도우를 표시합니다
                displayMarker(locPosition);
            });
        }

        function displayMarker(locPosition) {
            var marker = new kakao.maps.Marker({  
                map: map, 
                position: locPosition
            }); 
            
            // 지도 중심을 접속 위치로 변경합니다
            map.setCenter(locPosition);      
        }
    </script>
</body>
</html>
